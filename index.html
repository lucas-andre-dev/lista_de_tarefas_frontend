<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <h1>Lista de tarefas</h1>
    </header>
    
    <div id="table-container">
        <form id="form-tarefa">
            <button type="button" id="btn_add_tarefa">ADICIONAR TAREFA</button>
        </form>
        
        <table>
            <thead>
                <tr>
                    <th class="header-tarefa">ID</th>
                    <th class="header-tarefa">Nome da Tarefa</th>
                    <th class="header-tarefa">Custo (R$)</th>
                    <th class="header-tarefa">Data Limite</th>
                    <th class="header-tarefa">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-tarefas">
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2"><strong>Total dos Custos:</strong></td>
                    <td colspan="3" id="total-custo"><strong>R$ 0,00</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div id="modal-tarefa" class="modal" >
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-titulo">Adicionar Tarefa</h2>
            <form id="form-modal">
                <div class="form-group">
                    <label for="nome_tarefa">Nome da Tarefa:</label>
                    <input type="text" id="nome_tarefa" name="nome_tarefa" required>
                </div>
                <div class="form-group">
                    <label for="custo">Custo (R$):</label>
                    <input type="number" id="custo" name="custo" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="data_limite">Data Limite:</label>
                    <input type="date" id="data_limite" name="data_limite" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-salvar">Salvar</button>
                    <button type="button" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="tarefas.js"></script>
</body>
</html>
